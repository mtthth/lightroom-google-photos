name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Compilateur MSVC pour construire Lua sous Windows.
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.3'
      # Lua 5.3 remplace texlua (MiKTeX), qui est un Lua 5.3.
      - name: Suites Lua et JavaScript
        shell: pwsh
        run: |
          $env:TEXLUA = (Get-Command lua).Source
          node tests/lancer.mjs --mutants
