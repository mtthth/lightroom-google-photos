name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Les tests Lua utilisent texlua (MiKTeX) : Lua 5.3 avec les bibliothèques md5 et sha2 intégrées.
      - name: Installer MiKTeX
        shell: pwsh
        run: choco install miktex --no-progress -y
      - name: Suites Lua et JavaScript
        shell: pwsh
        run: |
          $env:TEXLUA = (Get-ChildItem -Path "$env:ProgramFiles\MiKTeX", "$env:LOCALAPPDATA\Programs\MiKTeX" `
            -Filter texlua.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $env:TEXLUA) { throw 'texlua.exe introuvable après l’installation de MiKTeX' }
          node tests/lancer.mjs --mutants
